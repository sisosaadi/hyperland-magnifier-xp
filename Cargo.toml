[package]
name = "hypr-xp-magnifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Docked screen magnifier in the style of Windows XP's Magnifier"

[dependencies]
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.34"
atspi = { version = "0.29", features = ["tokio"] }
atspi-proxies = "0.13"
futures-lite = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
